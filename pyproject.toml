[build-system]
# AVOID CHANGING REQUIRES: IT WILL BE UPDATED BY PYSCAFFOLD!
requires = ["setuptools>=46.1.0", "setuptools_scm[toml]>=5"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# For smarter version schemes and other configuration options,
# check out https://github.com/pypa/setuptools_scm
version_scheme = "no-guess-dev"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
strict_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "dateutil.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "requests_cache.*"
ignore_missing_imports = true

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
# Mirror the pylint E/W scope + pyflakes; exclude generated/example dirs.
select = ["E", "F", "W"]
ignore = [
    # E501: line too long — length enforced by black (line-length = 140 above)
    "E501",
]
exclude = ["tests", "scripts", "examples"]

[tool.pylint.messages_control]
# Disable categories and warnings for API model patterns
disable = [
    "C",                      # Conventions (docstrings, naming) — too noisy on auto-generated models
    "R",                      # Refactoring suggestions — not relevant for stable code
    "redefined-builtin",      # API models use 'id', 'type', 'filter' as field names
    "try-except-raise",       # Intentional re-raise in HttpHelper.catch_result
    "unused-argument",        # ABC stubs have unused params (e.g. FacetStats.from_dict)
    "unnecessary-ellipsis",   # Standard pattern for abstract method bodies
]

[tool.pylint.main]
# Ignore generated model files for certain checks
ignore-patterns = ["test_.*"]

[tool.commitizen]
version_provider = "scm"
tag_format = "v$version"
update_changelog_on_bump = false

[tool.isort]
profile = "black"
known_first_party = ["ffbb_api_client_v2"]

[tool.coverage.run]
source = ["src"]
branch = true
parallel = true
