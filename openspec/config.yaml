schema: spec-driven
context: |
  Project: FFBBApiClientV2_Python
  Purpose: Modern Python client library for the FFBB (French Basketball Federation) APIs with dual-backend facade (Directus REST + Meilisearch).
  Tech stack: Python 3.10+, requests, requests-cache, python-dateutil, python-dotenv, Directus, Meilisearch
  Domain context: FFBB basketball entities (organismes, clubs, salles, terrains, competitions, engagements, rencontres, joueurs, entraineurs, saisons) with typed models and dual-backend query pattern.
  Constraints: Preserve backward compatibility of the public API surface, enforce quality/security gates, and follow Git Flow/worktree policy.
  External dependencies: FFBB Directus REST API, FFBB Meilisearch instance, PyPI deps (requests, requests-cache, python-dateutil, python-dotenv).
rules:
  proposal:
    - Define clean code expectations, architecture boundaries, and target design patterns.
    - Include testing strategy (TDD scope, unit/integration/e2e coverage) and non-regression plan.
    - Include deployment and rollback approach when runtime behavior is impacted.
    - Include release impact, SemVer strategy, and required changelog/tag updates.
  spec:
    - Define coding constraints (Clean Code, SOLID, DRY, KISS, Clean Architecture).
    - Define required quality controls: pre-commit, lint, static analysis, tests, security checks.
    - Define measurable acceptance criteria for performance, reliability, and security.
    - Define release/tagging constraints (annotated vMAJOR.MINOR.PATCH tag, release notes).
  tasks:
    - Implement in small, reviewable increments with tests-first where possible.
    - Block completion until CI quality/security gates pass.
    - Update documentation, changelog, and release metadata before merge/release.
    - Capture deployment validation and rollback verification steps.
